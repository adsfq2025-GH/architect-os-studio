# Builds ArchitectOSStudioSetup.msi on a Windows runner — so NOBODY needs a local Windows
# dev machine. Push a tag (v1.0.0) or run manually; download the MSI from the run's Artifacts
# (and, for tags, from the auto-created GitHub Release).
name: Build Windows MSI

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: 'Architect-OS engine git ref (branch/tag) if in a separate repo'
        required: false
        default: 'main'
  push:
    tags: ['v*']

jobs:
  build-msi:
    runs-on: windows-latest
    # allow the built-in token to create a Release and attach the MSI on tag builds
    permissions:
      contents: write
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4

      # The engine (Architect-OS repo) is the compiler backend bundled into the app.
      # Option A: it's committed alongside as ./engine already — then this step is a no-op.
      # Option B: check it out from its own repo into ./engine-src and point ENGINE_SRC at it.
      - name: Checkout engine (Architect-OS)
        if: ${{ hashFiles('engine/bridge.py') == '' }}
        uses: actions/checkout@v4
        with:
          # engine repo name is case-insensitive on GitHub (architect-os == Architect-OS)
          repository: ${{ vars.ENGINE_REPO || github.repository_owner }}/architect-os
          ref: ${{ github.event.inputs.engine_ref || 'main' }}
          path: engine-src
          # default GITHUB_TOKEN can only read THIS repo; to read a PRIVATE engine repo add a
          # repo secret ENGINE_TOKEN (a PAT with Contents:read on architect-os). If the engine
          # repo is public, the default token works and no secret is needed.
          token: ${{ secrets.ENGINE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set ENGINE_SRC
        shell: pwsh
        run: |
          if (Test-Path engine/bridge.py) { echo "ENGINE_SRC=$(Resolve-Path engine)" >> $env:GITHUB_ENV }
          else { echo "ENGINE_SRC=$(Resolve-Path engine-src)" >> $env:GITHUB_ENV }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bundle engine + Python runtime + icon
        run: npm run prep

      - name: Type-check
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Package MSI (unsigned)
        # UNSIGNED build — no code-signing env vars are defined at all. (An EMPTY CSC_LINK/
        # WIN_CSC_LINK is worse than none: electron-builder treats "" as a path and fails with
        # "not a file". So we define nothing here.) Installs fine internally; SmartScreen may
        # warn on first run. To sign later, add a separate step that sets CSC_LINK (base64 .pfx)
        # + CSC_KEY_PASSWORD from real secrets.
        run: npx electron-builder --win msi --publish never

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchitectOSStudioSetup
          path: release/*.msi

      - name: Attach MSI to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.msi
