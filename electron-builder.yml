appId: com.mapranking.architectosstudio
productName: Architect OS Studio
copyright: Copyright © 2026 Map Ranking

directories:
  buildResources: build
  output: release

# The compiled Electron app + the bundled engine (Architect OS repo) + bundled Python runtime.
files:
  - out/**/*
  - package.json

# The Architect OS compiler + a self-contained Python runtime ship as app resources (the
# "engine"). scripts/prepare-engine.mjs copies the repo into ./engine; scripts/fetch-python.mjs
# places a Windows embeddable Python at ./engine/runtime. Both are bundled here, so the
# installed app needs NO Node.js and NO Python on the user's machine.
extraResources:
  - from: engine
    to: engine
    filter: ['**/*', '!**/__pycache__/**', '!**/*.pyc']

asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# ---- Windows ----
# Default target is MSI, emitted with the exact filename the team downloads.
win:
  target:
    - target: msi
  icon: build/icon.ico
  artifactName: ArchitectOSStudioSetup.${ext}
  fileAssociations:
    - ext: aosproj
      name: Architect OS Studio Project
      description: Architect OS Studio Project

msi:
  # Per-user install → a normal team member can double-click and install with no admin rights.
  # For fleet/GPO deployment, set perMachine: true (installs to Program Files, needs admin).
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Architect OS Studio

# NSIS .exe is also available if wanted: add `- target: nsis` above and re-run.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Architect OS Studio

# ---- macOS ----
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: Architect OS Studio ${version}

# ---- Auto-update feed (fill in before release) ----
publish:
  - provider: generic
    url: https://updates.example.com/architect-os-studio/
